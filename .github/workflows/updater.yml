name: Kiepscy Ranking Auto-Updater

on:
  repository_dispatch:
    types: [run-updater]
  workflow_dispatch:
    inputs:
      ep:
        description: 'Numer lub tytuł odcinka (np. 254)'
        required: false
        type: string
      newrate:
        description: 'Nowa ocena do doliczenia (np. 9)'
        required: false
        type: string
      fromuser:
        description: 'Użytkownik (np. kafel)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  update-ranking:
    runs-on: ubuntu-latest
    steps:
      - name: Klonowanie repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Pythona
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalacja bibliotek
        run: |
          pip install requests beautifulsoup4

      - name: Uruchomienie skryptu
        run: |
          CMD="python updater.py"
          if [ -n "${{ github.event.inputs.ep }}" ]; then
            CMD="$CMD --ep '${{ github.event.inputs.ep }}'"
          fi
          if [ -n "${{ github.event.inputs.newrate }}" ]; then
            CMD="$CMD --newrate '${{ github.event.inputs.newrate }}'"
          fi
          if [ -n "${{ github.event.inputs.fromuser }}" ]; then
            CMD="$CMD --fromuser '${{ github.event.inputs.fromuser }}'"
          fi
          echo "Wykonuję: $CMD"
          eval $CMD

      - name: Automatyczny commit zaktualizowanej bazy, logów i backupu
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Ręczna aktualizacja z GitHub Actions"
          file_pattern: baza_userow.json log.log tabela_backup.json
