name: Kiepscy Ranking Auto-Updater

on:
  repository_dispatch:
    types: [run-updater, gui-action]
  workflow_dispatch:
    inputs:
      ep:
        description: 'Numer lub tytuł odcinka'
        required: false
        type: string
      newrate:
        description: 'Nowa ocena do doliczenia'
        required: false
        type: string
      fromuser:
        description: 'Użytkownik'
        required: false
        type: string

permissions:
  contents: write

jobs:
  update-ranking:
    runs-on: ubuntu-latest
    steps:
      - name: Klonowanie repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Pythona
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalacja bibliotek
        run: |
          pip install requests beautifulsoup4

      - name: Uruchomienie skryptu
        run: |
          # Obsługa zdalnego wywołania z aplikacji GUI (client_payload)
          ACTION="${{ github.event.client_payload.action }}"
          EP="${{ github.event.client_payload.client_payload.ep || github.event.inputs.ep }}"
          
          # Sprawdzamy czy to wywołanie z GUI czy standardowe
          if [ -n "${{ github.event.client_payload.action }}" ]; then
            ACT="${{ github.event.client_payload.action }}"
            EP="${{ github.event.client_payload.ep }}"
            VAL="${{ github.event.client_payload.val }}"
            USER="${{ github.event.client_payload.user }}"

            if [ "$ACT" = "add" ]; then
              python updater.py --ep "$EP" --newrate "$VAL" --fromuser "$USER"
            elif [ "$ACT" = "delete" ]; then
              python updater.py --ep "$EP" --deleterate "$VAL" --fromuser "$USER"
            elif [ "$ACT" = "avg" ]; then
              python updater.py --ep "$EP" --newavg "$VAL" --ratnr "$USER"
            fi
          elif [ -n "${{ github.event.inputs.ep }}" ]; then
            # Ręczne uruchomienie z poziomu strony GitHuba z inputami
            CMD="python updater.py --ep '${{ github.event.inputs.ep }}'"
            if [ -n "${{ github.event.inputs.newrate }}" ]; then
              CMD="$CMD --newrate '${{ github.event.inputs.newrate }}'"
            fi
            if [ -n "${{ github.event.inputs.fromuser }}" ]; then
              CMD="$CMD --fromuser '${{ github.event.inputs.fromuser }}'"
            fi
            eval $CMD
          else
            # Standardowy obieg automatyczny
            python updater.py
          fi

      - name: Automatyczny commit zaktualizowanej bazy, logów i backupu
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Aktualizacja przez aplikację GUI / automatyczna"
          file_pattern: baza_userow.json log.log tabela_backup.json
