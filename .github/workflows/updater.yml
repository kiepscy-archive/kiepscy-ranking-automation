name: Kiepscy Ranking Auto-Updater

on:
  repository_dispatch:
    types: [run-updater, gui-action]
  workflow_dispatch:
    inputs:
      ep:
        description: 'Numer lub tytuł odcinka'
        required: false
        type: string
      newrate:
        description: 'Nowa ocena do doliczenia'
        required: false
        type: string
      fromuser:
        description: 'Użytkownik'
        required: false
        type: string

permissions:
  contents: write

jobs:
  update-ranking:
    runs-on: ubuntu-latest
    steps:
      - name: Klonowanie repozytorium
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Konfiguracja Pythona
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalacja bibliotek
        run: |
          pip install requests beautifulsoup4

      - name: Uruchomienie skryptu
        run: |
          ACT="${{ github.event.client_payload.action }}"
          EP="${{ github.event.client_payload.ep }}"
          VAL="${{ github.event.client_payload.val }}"
          USER="${{ github.event.client_payload.user }}"
          SAVEJSON="${{ github.event.client_payload.saveuserjson }}"

          INPUT_EP="${{ github.event.inputs.ep }}"
          INPUT_NEWRATE="${{ github.event.inputs.newrate }}"
          INPUT_USER="${{ github.event.inputs.fromuser }}"

          if [ -n "$ACT" ]; then
            echo "Wywołanie z GUI: akcja = $ACT"
            if [ "$ACT" = "add" ]; then
              python updater.py --ep "$EP" --newrate "$VAL" --fromuser "$USER"
            elif [ "$ACT" = "delete" ]; then
              python updater.py --ep "$EP" --deleterate "$VAL" --fromuser "$USER"
            elif [ "$ACT" = "avg" ]; then
              python updater.py --ep "$EP" --newavg "$VAL" --ratnr "$USER"
            elif [ "$ACT" = "save_users" ]; then
              python updater.py --saveuserjson "$SAVEJSON"
            fi
          elif [ -n "$INPUT_EP" ]; then
            echo "Ręczne uruchomienie z inputami"
            CMD="python updater.py --ep '$INPUT_EP'"
            if [ -n "$INPUT_NEWRATE" ]; then
              CMD="$CMD --newrate '$INPUT_NEWRATE'"
            fi
            if [ -n "$INPUT_USER" ]; then
              CMD="$CMD --fromuser '$INPUT_USER'"
            fi
            eval $CMD
          else
            echo "Automatyczny obieg cykliczny"
            python updater.py
          fi

      - name: Automatyczny commit zaktualizowanej bazy, logów i backupu
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automatyczna aktualizacja bazy i logów przez GitHub Actions"
          file_pattern: baza_userow.json log.log tabela_backup.json
          commit_user_name: "github-actions[bot]"
          commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
