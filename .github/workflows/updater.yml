name: Kiepscy Ranking Auto-Updater

on:
  schedule:
    - cron: '0 */6 * * *'
  repository_dispatch:
    types: [run-updater]
  workflow_dispatch:
    inputs:
      action:
        description: 'Akcja (add / delete / avg)'
        required: false
        type: string
      ep:
        description: 'Numer lub tytuł odcinka'
        required: false
        type: string
      val:
        description: 'Wartość (ocena lub nowa średnia)'
        required: false
        type: string
      user:
        description: 'Użytkownik lub liczba ocen'
        required: false
        type: string

permissions:
  contents: write

jobs:
  update-ranking:
    runs-on: ubuntu-latest
    steps:
      - name: Klonowanie repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Pythona
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalacja bibliotek
        run: |
          pip install requests beautifulsoup4

      - name: Uruchomienie skryptu (Wywołanie z GUI / EXE)
        if: ${{ github.event.client_payload.action != null || github.event.inputs.action != '' }}
        env:
          ACTION: ${{ github.event.inputs.action || github.event.client_payload.action }}
          EP: ${{ github.event.inputs.ep || github.event.client_payload.ep }}
          VAL: ${{ github.event.inputs.val || github.event.client_payload.val }}
          USER: ${{ github.event.inputs.user || github.event.client_payload.user }}
        run: |
          echo "Wywołanie z GUI/EXE -> Akcja: $ACTION, Odcinek: $EP, Val: $VAL, User/Ratnr: $USER"
          
          if [ "$ACTION" = "add" ]; then
            python updater.py --ep "$EP" --newrate "$VAL" --fromuser "$USER"
          elif [ "$ACTION" = "delete" ]; then
            python updater.py --ep "$EP" --deleterate "$VAL" --fromuser "$USER"
          elif [ "$ACTION" = "avg" ]; then
            python updater.py --ep "$EP" --newavg "$VAL" --ratnr "$USER"
          fi

      - name: Uruchomienie skryptu (Automatyczny Cron / Czysty Start)
        if: ${{ github.event.schedule != '' || (github.event.client_payload.action == null && github.event.inputs.action == '') }}
        run: |
          echo "Automatyczny obieg cykliczny - czysty start"
          python updater.py

      - name: Automatyczny commit zaktualizowanej bazy, logów i backupu
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Aktualizacja rankingu (Automatyczna / GUI)"
          file_pattern: baza_userow.json log.log tabela_backup.json
