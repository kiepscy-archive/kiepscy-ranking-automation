name: Kiepscy Ranking Auto-Updater

on:
  schedule:
    - cron: '0 */6 * * *'
  repository_dispatch:
    types: [run-updater]
  workflow_dispatch:
    inputs:
      act:
        description: 'Akcja (add / delete)'
        required: false
        type: string
      ep:
        description: 'Numer lub tytuł odcinka'
        required: false
        type: string
      newrate:
        description: 'Nowa ocena do doliczenia'
        required: false
        type: string
      deleterate:
        description: 'Ocena do usunięcia'
        required: false
        type: string
      fromuser:
        description: 'Użytkownik'
        required: false
        type: string

permissions:
  contents: write

jobs:
  update-ranking:
    runs-on: ubuntu-latest
    steps:
      - name: Klonowanie repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Pythona
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalacja bibliotek
        run: |
          pip install requests beautifulsoup4

      - name: Uruchomienie skryptu (GUI / EXE)
        if: ${{ github.event.inputs.act != '' && github.event.inputs.act != null }}
        env:
          ACT_INPUT: ${{ github.event.inputs.act }}
          EP_INPUT: ${{ github.event.inputs.ep }}
          RATE_INPUT: ${{ github.event.inputs.newrate }}
          DEL_INPUT: ${{ github.event.inputs.deleterate }}
          USER_INPUT: ${{ github.event.inputs.fromuser }}
        run: |
          echo "Wywołanie z GUI/EXE o akcji: $ACT_INPUT"
          if [ "$ACT_INPUT" = "add" ]; then
            python updater.py --ep "$EP_INPUT" --newrate "$RATE_INPUT" --fromuser "$USER_INPUT"
          elif [ "$ACT_INPUT" = "delete" ]; then
            python updater.py --ep "$EP_INPUT" --deleterate "$DEL_INPUT" --fromuser "$USER_INPUT"
          fi

      - name: Uruchomienie skryptu (Ręczne inputy bez act)
        if: ${{ (github.event.inputs.act == '' || github.event.inputs.act == null) && github.event.inputs.ep != '' && github.event.inputs.ep != null }}
        env:
          EP_INPUT: ${{ github.event.inputs.ep }}
          RATE_INPUT: ${{ github.event.inputs.newrate }}
          DEL_INPUT: ${{ github.event.inputs.deleterate }}
          USER_INPUT: ${{ github.event.inputs.fromuser }}
        run: |
          echo "Ręczne uruchomienie z inputami"
          CMD="python updater.py --ep '$EP_INPUT'"
          [ -n "$RATE_INPUT" ] && CMD="$CMD --newrate '$RATE_INPUT'"
          [ -n "$DEL_INPUT" ] && CMD="$CMD --deleterate '$DEL_INPUT'"
          [ -n "$USER_INPUT" ] && CMD="$CMD --fromuser '$USER_INPUT'"
          eval $CMD

      - name: Uruchomienie skryptu (Automatyczny Cron / Czysty Start)
        if: ${{ github.event.schedule != '' || (github.event.inputs.ep == '' && github.event.inputs.act == '') || (github.event.inputs.ep == null && github.event.inputs.act == null) }}
        run: |
          echo "Automatyczny obieg cykliczny - czysty start"
          python updater.py

      - name: Automatyczny commit zaktualizowanej bazy, logów i backupu
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automatyczna / GUI aktualizacja rankingu"
          file_pattern: baza_userow.json log.log tabela_backup.json
