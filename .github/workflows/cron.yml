name: Codzienna aktualizacja rankingu Kiepskich

on:
  schedule:
    # 0:01 czasu polskiego (dla czasu letniego UTC+2 to 22:01 UTC poprzedniego dnia)
    # Możesz dostosować godzinę UTC według potrzeb
    - cron: '1 22 * * *'
  
  # Pozwala na ręczne uruchomienie skryptu z zakładki "Actions" w GitHubie
  workflow_dispatch:

jobs:
  update-ranking:
    runs-on: ubuntu-latest
    
    steps:
      - name: Pobranie kodu z repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Pythona
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalacja zależności
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Uruchomienie skryptu updater.py
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASS: ${{ secrets.WP_APP_PASS }}
        run: |
          python updater.py
