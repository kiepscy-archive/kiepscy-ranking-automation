name: Kiepscy Ranking Auto-Updater

on:
  repository_dispatch:
    types: [run-updater]
  workflow_dispatch: # Pozwala też na ręczne odpalenie z poziomu strony GitHuba

jobs:
  update-ranking:
    runs-on: ubuntu-latest
    steps:
      - name: Klonowanie repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Pythona
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalacja bibliotek
        run: |
          pip install requests beautifulsoup4

      - name: Uruchomienie skryptu
        run: |
          python updater.py

      - name: Automatyczny commit zaktualizowanej bazy i logów
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automatyczna aktualizacje rankingu i bazy użytkowników"
          file_pattern: baza_userow.json log.log
